version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      compatible:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies]
    open-pull-requests-limit: 5
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      compatible:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies]
    open-pull-requests-limit: 5
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      compatible:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies]
    open-pull-requests-limit: 5
