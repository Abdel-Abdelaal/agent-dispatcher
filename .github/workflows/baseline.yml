name: Weekly baseline update
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
permissions: {}
jobs:
  baseline:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/baseline-sync.yml@40b37ce9647cc6cde2adc3d3d1acfc0aa06f92c9 # v1.10.0
    permissions:
      contents: read
      issues: write
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_APP_KEY: ${{ secrets.BOT_APP_KEY }}
