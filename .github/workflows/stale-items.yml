name: Stale items
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Inspect without changing issues or pull requests
        type: boolean
        default: true
permissions: {}
jobs:
  stale:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/stale.yml@f5e165971bf42fd3e5363ebd7baa0d827f81951c # v1.11.0
    permissions:
      issues: write
      pull-requests: write
    with:
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
