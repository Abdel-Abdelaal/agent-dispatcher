name: Stale items
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Inspect without changing issues or pull requests
        type: boolean
        default: true
permissions: {}
jobs:
  stale:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/stale.yml@2b86e583c1c8556eaf08816f39f52bbb724d5b65 # v1.12.1
    permissions:
      issues: write
      pull-requests: write
    with:
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
