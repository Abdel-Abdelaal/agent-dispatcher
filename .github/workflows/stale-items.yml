name: Stale items
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Inspect without changing issues or pull requests
        type: boolean
        default: true
permissions: {}
jobs:
  stale:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/stale.yml@0b7cd6a33abb89db1743c91d3f11cf98179ebcd2 # v1.9.0
    permissions:
      issues: write
      pull-requests: write
    with:
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
