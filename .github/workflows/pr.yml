name: PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# Deny everything by default; each job asks for only what it needs.
permissions: {}

jobs:
  pr-title:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/pr-title.yml@2b86e583c1c8556eaf08816f39f52bbb724d5b65 # v1.12.1
    permissions:
      pull-requests: read
