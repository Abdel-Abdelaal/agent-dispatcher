name: PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# Deny everything by default; each job asks for only what it needs.
permissions: {}

jobs:
  pr-title:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/pr-title.yml@f5e165971bf42fd3e5363ebd7baa0d827f81951c # v1.11.0
    permissions:
      pull-requests: read
