name: Lint
on:
  pull_request:
  schedule:
    - cron: '20 5 * * 1'
  workflow_dispatch:
permissions: {}
jobs:
  lint:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/lint.yml@0b7cd6a33abb89db1743c91d3f11cf98179ebcd2 # v1.9.0
    permissions:
      contents: read
    with:
      full-scan: ${{ github.event_name != 'pull_request' }}
