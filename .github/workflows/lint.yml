name: Lint
on:
  pull_request:
  schedule:
    - cron: '20 5 * * 1'
  workflow_dispatch:
permissions: {}
jobs:
  lint:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/lint.yml@2b86e583c1c8556eaf08816f39f52bbb724d5b65 # v1.12.1
    permissions:
      contents: read
    with:
      full-scan: ${{ github.event_name != 'pull_request' }}
