name: Lint
on:
  pull_request:
  schedule:
    - cron: '20 5 * * 1'
  workflow_dispatch:
permissions: {}
jobs:
  lint:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/lint.yml@aa42de723a82473499d8744c37ed4e571c868354 # v1.12.0
    permissions:
      contents: read
    with:
      full-scan: ${{ github.event_name != 'pull_request' }}
