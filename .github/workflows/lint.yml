name: Lint
on:
  pull_request:
  schedule:
    - cron: '20 5 * * 1'
  workflow_dispatch:
permissions: {}
jobs:
  lint:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/lint.yml@f5e165971bf42fd3e5363ebd7baa0d827f81951c # v1.11.0
    permissions:
      contents: read
    with:
      full-scan: ${{ github.event_name != 'pull_request' }}
