name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ci:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/python-ci.yml@40b37ce9647cc6cde2adc3d3d1acfc0aa06f92c9 # v1.10.0
    permissions:
      contents: read
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  report:
    needs: ci
    if: failure() && github.event_name == 'schedule'
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/report-failure.yml@40b37ce9647cc6cde2adc3d3d1acfc0aa06f92c9 # v1.10.0
    permissions:
      issues: write
    with:
      title: Nightly Python CI failed
