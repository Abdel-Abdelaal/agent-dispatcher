name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ci:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/python-ci.yml@0b7cd6a33abb89db1743c91d3f11cf98179ebcd2 # v1.9.0
    permissions:
      contents: read
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  report:
    needs: ci
    if: failure() && github.event_name == 'schedule'
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/report-failure.yml@0b7cd6a33abb89db1743c91d3f11cf98179ebcd2 # v1.9.0
    permissions:
      issues: write
    with:
      title: Nightly Python CI failed
