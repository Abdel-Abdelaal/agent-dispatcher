name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ci:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/python-ci.yml@f5e165971bf42fd3e5363ebd7baa0d827f81951c # v1.11.0
    permissions:
      contents: read
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  report:
    needs: ci
    if: failure() && github.event_name == 'schedule'
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/report-failure.yml@f5e165971bf42fd3e5363ebd7baa0d827f81951c # v1.11.0
    permissions:
      issues: write
    with:
      title: Nightly Python CI failed
