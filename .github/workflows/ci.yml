name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ci:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/python-ci.yml@2b86e583c1c8556eaf08816f39f52bbb724d5b65 # v1.12.1
    permissions:
      contents: read
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  report:
    needs: ci
    if: failure() && github.event_name == 'schedule'
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/report-failure.yml@2b86e583c1c8556eaf08816f39f52bbb724d5b65 # v1.12.1
    permissions:
      issues: write
    with:
      title: Nightly Python CI failed
