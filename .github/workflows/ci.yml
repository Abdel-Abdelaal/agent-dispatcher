name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ci:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/python-ci.yml@aa42de723a82473499d8744c37ed4e571c868354 # v1.12.0
    permissions:
      contents: read
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  report:
    needs: ci
    if: failure() && github.event_name == 'schedule'
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/report-failure.yml@aa42de723a82473499d8744c37ed4e571c868354 # v1.12.0
    permissions:
      issues: write
    with:
      title: Nightly Python CI failed
