name: Security checks
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
permissions: {}
jobs:
  security:
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/security.yml@0b7cd6a33abb89db1743c91d3f11cf98179ebcd2 # v1.9.0
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    with:
      languages: auto
  report:
    needs: security
    if: failure() && github.event_name == 'schedule'
    uses: Abdel-Abdelaal/platform-workflows/.github/workflows/report-failure.yml@0b7cd6a33abb89db1743c91d3f11cf98179ebcd2 # v1.9.0
    permissions:
      issues: write
    with:
      title: Weekly security checks failed
