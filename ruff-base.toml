line-length = 88
target-version = "py312"

[lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "SIM", "C90", "PL", "ANN", "ERA", "BLE", "TRY", "S", "RUF", "PT", "RET", "ARG", "PTH", "DTZ", "T20"]
ignore = ["D203", "D213"]

[lint.pydocstyle]
convention = "google"

[lint.mccabe]
max-complexity = 10
